[workspace]
resolver = "2"
members = [
    "crates/aii-types",
    "crates/aii-codec",
    "crates/aii-crypto",
    "crates/aii-storage",
    "crates/aii-block",
    "crates/aii-state",
    "crates/aii-config",
    "crates/aii-consensus-iface",
    "crates/aii-metrics",
    "crates/aii-wallet",
    "crates/aii-vnode",
    "crates/aii-net-txpool",
    "crates/aii-microchain",
    "crates/aii-rpc",
    "crates/aii-node",
    "crates/aii-evm",
    "crates/aii-net-p2p",
    "crates/aii-net-sync",
    "crates/aii-onboarding",
    "crates/aii-cli",
    "crates/aii-mcp",
    "crates/aii-consensus-bft",
    "crates/aii-crosschain",
    "crates/aii-wasm",
    "crates/aii-wasm-state",
]

[workspace.package]
version = "0.0.28"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AII-Network/aii"
authors = ["AII Network contributors"]

[workspace.dependencies]
alloy-primitives = { version = "0.8", default-features = false, features = ["serde"] }
alloy-rlp = { version = "0.3", default-features = false, features = ["std", "derive"] }
ssz_rs = { version = "0.9", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "2"
tracing = "0.1"
proptest = "1"
quickcheck = "1"
hex = { version = "0.4", default-features = false, features = ["alloc"] }

aii-types = { path = "crates/aii-types", version = "0.0.28" }
aii-codec = { path = "crates/aii-codec", version = "0.0.28" }
aii-crypto = { path = "crates/aii-crypto", version = "0.0.28" }
aii-storage = { path = "crates/aii-storage", version = "0.0.28" }
aii-block = { path = "crates/aii-block", version = "0.0.28" }
aii-state = { path = "crates/aii-state", version = "0.0.28" }
aii-config = { path = "crates/aii-config", version = "0.0.28" }
aii-consensus-iface = { path = "crates/aii-consensus-iface", version = "0.0.28" }
aii-metrics = { path = "crates/aii-metrics", version = "0.0.28" }
aii-wallet = { path = "crates/aii-wallet", version = "0.0.28" }
aii-vnode = { path = "crates/aii-vnode", version = "0.0.28" }
aii-net-txpool = { path = "crates/aii-net-txpool", version = "0.0.28" }
aii-microchain = { path = "crates/aii-microchain", version = "0.0.28" }
aii-rpc = { path = "crates/aii-rpc", version = "0.0.28" }
aii-node = { path = "crates/aii-node", version = "0.0.28" }
aii-evm = { path = "crates/aii-evm", version = "0.0.28" }
aii-net-p2p = { path = "crates/aii-net-p2p", version = "0.0.28" }
aii-net-sync = { path = "crates/aii-net-sync", version = "0.0.28" }
aii-onboarding = { path = "crates/aii-onboarding", version = "0.0.28" }
aii-cli = { path = "crates/aii-cli", version = "0.0.28" }
aii-mcp = { path = "crates/aii-mcp", version = "0.0.28" }
aii-consensus-bft = { path = "crates/aii-consensus-bft", version = "0.0.28" }
aii-crosschain = { path = "crates/aii-crosschain", version = "0.0.28" }
aii-wasm = { path = "crates/aii-wasm", version = "0.0.28" }
aii-wasm-state = { path = "crates/aii-wasm-state", version = "0.0.28" }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Pedantic / nursery sub-lints intentionally allowed across the workspace.
# Errors are documented in module-level docstrings, not per-fn.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Foundational data types — `#[must_use]` everywhere is noise.
must_use_candidate = "allow"
# Doc-prose holds acronyms (RLP / EIP-XXXX / AlgoId) that read better
# without backtick clutter.
doc_markdown = "allow"
# Casts between fixed-size integers are guarded by domain invariants
# (bit indices < 2048, RLP payload lengths < usize::MAX).
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
# `h`, `s`, `r`, `v` are protocol field names, not arbitrary bindings.
many_single_char_names = "allow"
match_same_arms = "allow"
# `&Option<T>` is acceptable for crate-private helper fns.
ref_option = "allow"
option_if_let_else = "allow"
format_push_string = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
