[workspace]
resolver = "2"
members = [
    "crates/aii-types",
    "crates/aii-codec",
    "crates/aii-crypto",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AII-Network/aii"
authors = ["AII Network contributors"]

[workspace.dependencies]
alloy-primitives = { version = "0.8", default-features = false, features = ["serde"] }
alloy-rlp = { version = "0.3", default-features = false, features = ["std"] }
ssz_rs = { version = "0.9", default-features = false }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "2"
tracing = "0.1"
proptest = "1"
quickcheck = "1"
hex = { version = "0.4", default-features = false, features = ["alloc"] }

aii-types = { path = "crates/aii-types", version = "0.0.2" }
aii-codec = { path = "crates/aii-codec", version = "0.0.2" }
aii-crypto = { path = "crates/aii-crypto", version = "0.0.2" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = "warn"
nursery = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
