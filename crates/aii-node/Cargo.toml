[package]
name = "aii-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "aiid — the AII node binary."
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "aiid"
path = "src/main.rs"

[dependencies]
aii-types = { workspace = true }
aii-config = { workspace = true }
aii-storage = { workspace = true }
aii-rpc = { workspace = true }
aii-metrics = { workspace = true }
aii-block = { workspace = true }
aii-state = { workspace = true }
aii-consensus-bft = { workspace = true }
aii-crypto = { workspace = true }
aii-cli = { workspace = true }
hex = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "test-util", "net", "time"] }
jsonrpsee = { version = "0.26", default-features = false, features = ["client", "http-client"] }
tempfile = "3"
