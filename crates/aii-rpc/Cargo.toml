[package]
name = "aii-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "JSON-RPC + WebSocket server for AII (eth_* + aii_* namespaces)."
readme = "README.md"

[lints]
workspace = true

[dependencies]
aii-types = { workspace = true }
aii-config = { workspace = true }
aii-block = { workspace = true }
aii-crypto = { workspace = true }
aii-net-txpool = { workspace = true }
alloy-rlp = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
jsonrpsee = { version = "0.26", default-features = false, features = ["server", "macros", "client", "http-client"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "test-util", "net", "time"] }
